# One Repute — Frontend SPA Web Server
# Serves the compiled React/Vite SPA from /usr/share/nginx/html.
#
# The React app uses client-side (browser) routing. For direct navigation to
# paths like /outlet-dashboard, /settings, /billing — where no physical file
# exists — unknown paths must fall back to /index.html so the SPA can take
# over routing. Without this, direct URL loads return a server-level 404.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: only ever serve real files — a missing asset must return
    # a real 404, never the SPA shell (prevents confusing 200s for JS/CSS).
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|otf|map|json|webmanifest|txt)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback: real files first, then prerendered route
    # directories (/login/, /onboarding/, ...), then index.html for
    # client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}